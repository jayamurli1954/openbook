[package]
name = "openbook-desktop"
version = "0.0.0"
description = "OpenBook Studio desktop shell (foundation scaffold)"
authors = ["SanMitra Tech Solutions"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "openbook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-sql = { version = "=2.4.1", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
